name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      # An unedited group copy follows the runner at the next restart, and the
      # container compiles it under `set -e`: a type error stops every container.
      - name: Typecheck agent runner
        working-directory: container/agent-runner
        run: npm ci --no-audit --no-fund && npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: pip install -r requirements-dev.txt

      - name: Python tests
        run: pytest
